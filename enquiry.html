<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | She Skates</title>
    <meta name="description" content="Enquire about volunteering with or sponsoring She Skates, a girls and women skating organisation in Vaal and Sebokeng.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header> <a href="index.html">She Skates</a> <nav> <ul> <li><a href="index.html">Home</a></li> <li><a href="about.html">About Us</a></li> <li><a href="services.html">Services</a></li> <li><a href="enquiry.html">Enquiry</a></li> <li><a href="contact.html">Contact</a></li> </ul> </nav> </header>

    <h1>Volunteer or Sponsor Us</h1>
    <p>Tell us how you'd like to get involved and we'll be in touch.</p>

    <form id="enquiry-form" action="https://jsonplaceholder.typicode.com/posts" method="post" novalidate>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" minlength="2" maxlength="50" required>
        <p class="error" id="name-error"></p>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
        <p class="error" id="email-error"></p>

        <label for="phone">Phone Number (10 digits)</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" placeholder="0821234567" required>
        <p class="error" id="phone-error"></p>

        <label for="interest">I'm interested in</label>
        <select id="interest" name="interest" required>
            <option value="">Please choose</option>
            <option value="volunteer">Volunteering</option>
            <option value="sponsor">Sponsoring</option>
        </select>
        <p class="error" id="interest-error"></p>

        <label for="start-date">Preferred start date</label>
        <input type="date" id="start-date" name="start-date" required>
        <p class="error" id="date-error"></p>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" minlength="10" maxlength="300" required></textarea>
        <p class="error" id="message-error"></p>

        <button type="submit">Send Enquiry</button>
    </form>

    <p id="enquiry-response"></p>

    <script src="js/script.js"></script>
</body>
</html>
